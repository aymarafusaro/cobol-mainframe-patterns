name: Configuración ZAPP del proyecto

description: >-
  Configuración de IBM Z Open Editor para el proyecto de patrones COBOL
  Mainframe. La búsqueda se realiza sobre las carpetas locales especificadas
  en las entradas de "locations". Para utilizar ubicaciones remotas de
  Mainframe, se puede agregar una entrada de tipo "MVS". Para más información,
  consultar la documentación de IBM Z Open Editor:
  https://ibm.github.io/zopeneditor-about/Docs/setting_propertygroup.html

author: IBM Z Open Editor

propertyGroups:
  - name: search-all
    libraries:
      - name: syslib
        type: local
        locations:
          - '**'
